<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none';" />
<title>DeepSeek Quick</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="panel">

  <header class="titlebar">
    <div class="brand">
      <img class="mark" src="assets/logo.svg" alt="DeepSeek" />
      <span class="brand-name">DeepSeek Quick</span>
      <span class="session-title" id="sessionTitle"></span>
    </div>
    <div class="actions">
      <button class="icon-btn" id="btnSessions" title="会话列表">
        <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <button class="icon-btn" id="btnNew" title="新对话">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button class="icon-btn" id="btnSettings" title="设置">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
      <button class="icon-btn" id="btnClose" title="关闭">
        <svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
  </header>

  <div class="notice hidden" id="notice"></div>

  <main class="stream" id="stream">
    <div class="empty" id="empty">
      <img class="empty-mark" src="assets/logo.svg" alt="" />
      <div class="empty-title">我是 DeepSeek，很高兴见到你！</div>
      <div class="empty-hint">我可以帮你写代码、读文件、写作各种创意内容，请把你的任务交给我吧~</div>
    </div>
  </main>

  <footer class="composer">
    <button class="to-bottom hidden" id="btnToBottom" title="回到底部">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
    </button>
    <div class="attach-row hidden" id="attachRow"></div>
    <div class="input-wrap">
      <textarea id="input" rows="1" placeholder="给 DeepSeek 发送消息" spellcheck="false"></textarea>
      <div class="input-toolbar">
        <div class="chips">
          <button class="toggle on" id="btnModel" title="切换模型">
            <svg class="chip-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 2.6 20.6 7v10L12 21.4 3.4 17V7L12 2.6Z" />
              <path d="M3.6 7.1 12 11.6l8.4-4.5" />
              <path d="M12 11.6v9.7" />
            </svg>
            <span class="chip-label">模型 <span id="modelTag">DeepSeek-V4.1-Flash</span></span>
          </button>
          <button class="toggle" id="btnThinking" title="推理等级">
            <svg class="chip-icon" viewBox="0 0 24 24" aria-hidden="true">
              <ellipse cx="12" cy="12" rx="9" ry="3.5" />
              <ellipse cx="12" cy="12" rx="9" ry="3.5" transform="rotate(60 12 12)" />
              <ellipse cx="12" cy="12" rx="9" ry="3.5" transform="rotate(120 12 12)" />
              <circle class="dot" cx="12" cy="12" r="1.5" />
            </svg>
            <span class="chip-label">推理 <span id="effortLabel">High</span></span>
          </button>
          <button class="toggle" id="btnSearch" title="联网搜索（由模型决定是否检索）">
            <svg class="chip-icon" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="10" />
              <path d="M2 12h20" />
              <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20" />
            </svg>
            <span class="chip-label">智能搜索</span>
          </button>
        </div>
        <div class="input-actions">
          <button class="attach-btn" id="btnAttach" title="添加图片或文档（也可直接粘贴或拖入）">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20.5 11.5 12 20a5 5 0 0 1-7-7l8-8a3.4 3.4 0 0 1 4.8 4.8l-8 8a1.8 1.8 0 0 1-2.5-2.5l7.2-7.2" />
            </svg>
          </button>
          <button class="send-btn" id="btnSend" title="发送">
            <svg viewBox="0 0 24 24" id="sendIcon"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </button>
        </div>
      </div>
    </div>
    <div class="usage-bar hidden" id="usage"></div>
  </footer>

  <section class="settings hidden" id="settings">
    <div class="panel-head">
      <button class="icon-btn" id="btnSettingsClose" title="返回">
        <svg viewBox="0 0 24 24"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
      </button>
      <h2>设置</h2>
    </div>
    <label class="field">
      <span class="field-label">DeepSeek API Key</span>
      <input type="password" id="apiKeyInput" placeholder="sk-..." autocomplete="off" spellcheck="false" />
      <span class="field-hint" id="keyHint">在 platform.deepseek.com 创建，保存在本机</span>
    </label>
    <div class="settings-actions">
      <button class="btn primary" id="btnSaveKey">保存</button>
      <button class="btn ghost" id="btnTestKey">测试连通</button>
    </div>
    <div class="settings-meta">
      <div><span>版本</span><b id="metaVersion">-</b></div>
      <div><span>模型</span><b id="metaModel">deepseek-flash</b></div>
      <div><span>热键</span><b id="metaHotkey">-</b></div>
      <div><span>配置文件</span><b class="mono" id="metaPath">-</b></div>
    </div>
  </section>

  <section class="sessions hidden" id="sessionsPanel">
    <div class="panel-head">
      <button class="icon-btn" id="btnSessionsClose" title="返回">
        <svg viewBox="0 0 24 24"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
      </button>
      <h2>会话</h2>
    </div>
    <button class="new-session-btn" id="btnNewSession">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      <span>新建会话</span>
    </button>
    <div class="session-list" id="sessionList"></div>
    <button class="clear-all-btn hidden" id="btnClearAll">清空全部会话</button>
  </section>

</div>

<div class="menu hidden" id="menuModel" role="menu"></div>
<div class="menu hidden" id="menuEffort" role="menu"></div>

<script src="vendor/markdown-it.min.js"></script>
<script src="app.js"></script>
</body>
</html>
